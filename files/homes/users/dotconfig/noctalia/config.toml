[bar.default]
center = [ "workspaces" ]
end = [ "tray", "notifications", "volume", "brightness", "battery" ]
margin_edge = 0
margin_ends = 0
position = "bottom"
radius = 0
shadow = false
start = [ "launcher", "control-center", "session", "clock", "date" ]

[calendar]
enabled = true

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "clipboard"

[desktop_widgets]
enabled = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 5

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 957.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

[[plugins.source]]
enabled = false
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"
name = "official"

[[plugins.source]]
enabled = false
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"
name = "community"

[shell]
clipboard_auto_paste = "off"
font_family = "Atkinson Hyperlegible Next"
niri_overview_type_to_launch_enabled = true
settings_show_advanced = true
telemetry_enabled = true
ui_scale = 1.05

    [shell.animation]
    enabled = false

    [shell.panel]
    shadow = false
    control_center_placement = "attached"
    open_near_click_control_center = true
    open_near_click_session = true
    session_placement = "centered"

    [shell.screenshot]
    copy_to_clipboard = false
    freeze_screen = false
    save_to_file = false

[theme]
community_palette = "Gruber Darker"
source = "community"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "qt" ]
    enable_builtin_templates = true
    enable_community_templates = false

[wallpaper]
directory = "~/Pictures"

    [wallpaper.automation]
    recursive = false

    [wallpaper.default]
    path = "~/Pictures/wallpaper.png"

    [wallpaper.last]
    path = "~/Pictures/wallpaper.png"

    [wallpaper.monitors.eDP-1]
    path = "~/Pictures/wallpaper.png"

[weather]
effects = false
refresh_minutes = 60
